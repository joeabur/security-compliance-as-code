# Mappings indicate related outcomes, not equivalence or certification.
mappings:
  CIS-AWS-1.4:
    - framework: NIST CSF
      control: NIST-PR.AC-7
      rationale: Both address stronger authentication for privileged access.
    - framework: PCI DSS
      control: PCI-8.4
      rationale: Both address multi-factor authentication, with different scope and evidence requirements.
  CIS-AWS-3.1:
    - framework: NIST CSF
      control: NIST-DE.CM-1
      rationale: Both support security monitoring and event visibility.
    - framework: ISO 27001
      control: ISO-A.8.15
      rationale: Both address event logging, while governance and implementation expectations differ.
